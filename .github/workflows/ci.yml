name: ci

on:
  push:
    branches:
      - main
      - feature/rfp-lens-mvp
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rfp_lens
          POSTGRES_USER: rfp_lens
          POSTGRES_PASSWORD: rfp_lens
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U rfp_lens -d rfp_lens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RFP_LENS_JWT_SECRET: ci-only-secret-that-is-long-enough-for-hs256
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Run backend tests
        working-directory: backend
        run: uv run pytest -q
      - name: Check migrations match models
        working-directory: backend
        env:
          RFP_LENS_DATABASE_URL: postgresql+psycopg://rfp_lens:rfp_lens@localhost:5432/rfp_lens
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Run fake provider evaluation
        working-directory: backend
        run: uv run python -m evals.run --provider fake --output eval-results.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run
      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rfp_lens
          POSTGRES_USER: rfp_lens
          POSTGRES_PASSWORD: rfp_lens
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U rfp_lens -d rfp_lens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RFP_LENS_JWT_SECRET: ci-only-secret-that-is-long-enough-for-hs256
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install chromium --with-deps
      - name: Run Playwright suite
        working-directory: e2e
        run: npm test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build ./backend
      - name: Build frontend image
        run: docker build ./frontend
