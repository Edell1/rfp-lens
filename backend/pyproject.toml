[project]
name = "rfp-lens-backend"
version = "0.1.0"
description = "Evidence-linked government R&D RFP analysis backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "celery[redis]>=5.5,<6",
    "defusedxml>=0.7,<1",
    "fastapi>=0.116,<0.117",
    "openai>=1.99,<3",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.2,<1",
    "pydantic-settings>=2.10,<3",
    "pyjwt>=2.10,<3",
    "pymupdf>=1.26,<2",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "freezegun>=1.5,<2",
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "testcontainers[postgres,redis]>=4.12,<5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
